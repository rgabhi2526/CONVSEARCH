[project]
name = "convsearch"
version = "0.1.0"
description = "Multi-turn conversational search with rewrite fusion, topic-shift gate and Boolean df-feedback agent (CSD358 IR, T2)"
readme = "README.md"
authors = [
    { name = "abhyudaya vasisht", email = "abhyudayavasisht@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.28.0",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bm25s>=0.3.12",
    "matplotlib>=3.11.2",
    "scipy>=1.18.1",
]
